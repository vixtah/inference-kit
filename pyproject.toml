[project]
name = "inference-kit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.120", "pydantic>=2.12", "orbit-jobs"]

[tool.uv.sources]
orbit-jobs = { git = "https://github.com/vixtah/orbit-jobs", tag = "v0.1.1" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inference_kit"]
